# The preview build (the site plus the brand design directions, rounds 1 to 3) on GitHub Pages,
# for review: https://<owner>.github.io/<repo>/component-lab/brand/
# The preview is hosted on Netlify (netlify.toml); this is a by-hand alternative, run from the
# Actions tab. Pages must be set to "GitHub Actions" once (Settings → Pages → Build and
# deployment → Source).
name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      # Pages serves the site under /<repo>/: prefix its root paths and mark every page noindex
      - run: node scripts/deploy/pages-base.mjs "/${{ github.event.repository.name }}" dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
